name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Use the declared npm version
        run: npm install --global npm@11.19.0

      - run: npm ci
      - run: npm run release:check

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-compas-threejs-vsix
          path: vscode-compas-threejs-*.vsix
          if-no-files-found: error
          retention-days: 7
